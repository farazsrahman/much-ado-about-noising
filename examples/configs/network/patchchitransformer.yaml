# @package network
defaults:
  - _base
  - _self_

network_type: "patchchitransformer"
emb_dim: 256
num_layers: 8
n_heads: 4
patch_size: 14        # 84x84 / 14 = 6x6 = 36 patches per camera, no resizing needed
n_cond_layers: 0      # 0=MLP obs encoder, >0=Transformer (enables patch self-attention)
attn_dropout: 0.1
dropout: 0.0
timestep_emb_type: "positional"
